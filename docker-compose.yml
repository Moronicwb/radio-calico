services:
  app:
    build:
      context: .
      target: prod
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://radiocalico:localdev@postgres:5432/radiocalico
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radiocalico
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: radiocalico
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiocalico"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
