<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Calico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <nav>
    <div style="width:80px"></div>
    <div class="logo-wrap">
      <img src="/RadioCalicoLogoTM.png" alt="Radio Calico" />
    </div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
      <span class="toggle-icon">🌿</span>
      <div class="toggle-track"><div class="toggle-knob"></div></div>
    </button>
  </nav>

  <main>
    <h2>Now Playing</h2>

    <div class="player-card">
      <div class="album-art-wrap" id="album-art-wrap">
        <img id="album-art-img" src="" alt="Album art" style="display:none;width:100%;height:100%;object-fit:cover;" />
        <span class="placeholder" id="album-art-placeholder">🎵</span>
      </div>

      <div class="meta">
        <div class="artist"      id="artist">Loading…</div>
        <div class="track-title" id="title"></div>
        <div class="album"       id="album"></div>

        <div class="quality">
          <div>Source quality: <span id="source-quality"></span></div>
          <div>Stream quality: <span id="stream-quality"></span></div>
        </div>

        <div class="ratings">
          Rate this track:
          <button id="rate-up"   title="Thumbs up">👍 <span id="count-up">0</span></button>
          <button id="rate-down" title="Thumbs down">👎 <span id="count-down">0</span></button>
        </div>

        <div class="controls">
          <button id="play-btn" aria-label="Play">▶</button>
          <span class="live-badge">LIVE</span>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume" />
          <span>🔊</span>
        </div>
      </div>
    </div>

    <div class="previous-tracks">
      <h3>Previous tracks</h3>
      <div id="track-list"></div>
    </div>
  </main>

  <footer>
    &copy; Radio Calico — ad-free, crystal-clear audio
  </footer>

  <audio id="stream" preload="none"></audio>

  <script type="module" src="/app.js"></script>
</body>
</html>
